name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Runs on every supported Node LTS line. The floor the library DECLARES is
  # `engines.node` (>=20.19.0); Node 20 is end-of-life, so it is not exercised.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    name: build-and-test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test (engine corpus + Angular specs)
        run: npm test
      - name: Library build
        run: npm run build:styles && npx ng build angular-advanced-odontogram
      - name: Demo build
        run: npm run build:demo
