name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test (engine corpus + Angular specs)
        run: npm test
      - name: Library build
        run: npm run build:styles && npx ng build angular-advanced-odontogram
      - name: Demo build
        run: npm run build:demo
